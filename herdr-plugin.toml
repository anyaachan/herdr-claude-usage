id = "herdr-claude-usage"
name = "Claude Usage"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Global Claude Code plan usage in one place: a compact tab-bar entry and a pretty popup dashboard with session and weekly bars. Data is pushed by Claude Code's own statusLine hook - no credentials touched."
platforms = ["macos", "linux"]

[[actions]]
id = "configure"
title = "Claude Usage: set up statusLine, tab bar, and keybinding"
contexts = ["workspace"]
command = ["bash", "bin/herdr-claude-usage", "configure"]

[[actions]]
id = "uninstall"
title = "Claude Usage: remove statusLine and config entries"
contexts = ["workspace"]
command = ["bash", "bin/herdr-claude-usage", "uninstall"]

[[panes]]
id = "dashboard"
title = "Claude usage"
placement = "overlay"
command = ["bash", "bin/herdr-claude-usage", "dashboard"]
